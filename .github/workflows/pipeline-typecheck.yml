name: Native PPT pipeline typecheck

on:
  push:
    branches: [main, native-ppt-engine]
    paths:
      - "site/src/lib/pipeline/**"
      - "site/src/lib/pptx-prompts.ts"
      - "site/package.json"
      - "site/bun.lock"
      - ".github/workflows/pipeline-typecheck.yml"
  pull_request:
    paths:
      - "site/src/lib/pipeline/**"
      - "site/src/lib/pptx-prompts.ts"
      - "site/package.json"
      - "site/bun.lock"
      - ".github/workflows/pipeline-typecheck.yml"

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install site dependencies
        working-directory: site
        run: bun install --frozen-lockfile
      - name: Type-check the native generation pipeline
        working-directory: site
        run: bun run typecheck
      - name: Unit-test the review / repair contracts
        working-directory: site
        run: bun run test:pipeline
