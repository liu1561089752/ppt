name: Native PPT engine tests

on:
  push:
    branches: [main, native-ppt-engine]
    paths:
      - "pptx/native/**"
      - "pptx/batch_native_pptx.js"
      - "pptx/batch_html2pptx.js"
      - "pptx/slide_order.js"
      - "pptx/scripts/extract_native_design.py"
      - "pptx/scripts/extract_html_design_tokens.py"
      - "pptx/native/parity/**"
      - "pptx/tests/**"
      - "pptx/examples/**"
      - "pptx/SKILL.md"
      - ".github/workflows/native-ppt.yml"
  pull_request:
    paths:
      - "pptx/native/**"
      - "pptx/batch_native_pptx.js"
      - "pptx/batch_html2pptx.js"
      - "pptx/slide_order.js"
      - "pptx/scripts/extract_native_design.py"
      - "pptx/scripts/extract_html_design_tokens.py"
      - "pptx/native/parity/**"
      - "pptx/tests/**"
      - "pptx/examples/**"
      - "pptx/SKILL.md"
      - ".github/workflows/native-ppt.yml"

jobs:
  test-and-render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install rendering tools
        run: |
          sudo apt-get update
          sudo apt-get install -y libreoffice-impress poppler-utils fonts-noto-cjk python3-pil
      - name: Install native engine dependencies
        working-directory: pptx/native
        run: npm install --no-audit --no-fund
      - name: Check legacy batch converter syntax
        run: |
          node --check pptx/batch_html2pptx.js
          node --check pptx/slide_order.js
      - name: Run native engine tests
        working-directory: pptx/native
        run: npm test
      - name: Extract CSS design tokens and generate migration demo
        working-directory: pptx/native
        run: |
          python ../scripts/extract_html_design_tokens.py ../examples/design-reference.html native-theme-profile
          npm run demo:theme
          npm run demo:parity
      - name: Generate editable demo decks
        working-directory: pptx/native
        run: |
          npm run demo
          npm run demo:components
          npm run batch:example
      - name: Extract design profile from generated deck
        working-directory: pptx/native
        run: python ../scripts/extract_native_design.py native-components-demo.pptx design-profile
      - name: Compile and test design extraction scripts
        working-directory: pptx/native
        run: |
          python -m py_compile ../scripts/extract_native_design.py ../scripts/extract_html_design_tokens.py scripts/render_check.py scripts/visual_regression.py
          python ../scripts/extract_html_design_tokens.py --self-test
          python scripts/visual_regression.py --self-test
      - name: Render and verify demo decks
        working-directory: pptx/native
        run: |
          npm run render:demo
          npm run render:components
          npm run render:batch
          npm run render:theme
          npm run render:parity
      - name: Compare against reviewed golden slide images
        working-directory: pptx/native
        run: |
          set -e
          for deck in native-demo native-components-demo native-design-migration-demo native-design-parity-demo; do
            golden="golden/$deck"
            if [ -d "$golden" ] && find "$golden" -maxdepth 1 -name '*.png' -print -quit | grep -q .; then
              python scripts/visual_regression.py \
                --baseline-dir "$golden" \
                --current-dir "render-check/$deck" \
                --output-dir "visual-regression/$deck" \
                --max-mae 0.015 --min-ssim 0.97
            else
              echo "No reviewed golden images for $deck; comparator self-test remains enabled."
            fi
          done
      - name: Upload PPTX and rendered previews
        uses: actions/upload-artifact@v4
        with:
          name: native-ppt-rendered-demos
          path: |
            pptx/native/native-demo.pptx
            pptx/native/native-components-demo.pptx
            pptx/native/native-design-migration-demo.pptx
            pptx/native/native-design-parity-demo.pptx
            pptx/native/native-theme-profile/\n            pptx/native/parity/
            pptx/native/batch-dist/
            pptx/native/render-check/
            pptx/native/visual-regression/
            pptx/native/design-profile/
            pptx/native/themes/
            pptx/scripts/extract_html_design_tokens.py
            pptx/native/scripts/visual_regression.py
