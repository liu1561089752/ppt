name: Native PPT engine tests

on:
  push:
    branches: [main, native-ppt-engine]
    paths:
      - "pptx/native/**"
      - "pptx/batch_native_pptx.js"
      - "pptx/batch_html2pptx.js"
      - "pptx/slide_order.js"
      - "pptx/scripts/extract_native_design.py"
      - "pptx/scripts/extract_html_design_tokens.py"
      - "pptx/native/parity/**"
      - "pptx/native/pipeline/**"
      - "pptx/native/scripts/preview_deck.py"
      - "pptx/tests/**"
      - "pptx/examples/**"
      - "pptx/SKILL.md"
      - ".github/workflows/native-ppt.yml"
  pull_request:
    paths:
      - "pptx/native/**"
      - "pptx/batch_native_pptx.js"
      - "pptx/batch_html2pptx.js"
      - "pptx/slide_order.js"
      - "pptx/scripts/extract_native_design.py"
      - "pptx/scripts/extract_html_design_tokens.py"
      - "pptx/native/parity/**"
      - "pptx/native/pipeline/**"
      - "pptx/tests/**"
      - "pptx/examples/**"
      - "pptx/SKILL.md"
      - ".github/workflows/native-ppt.yml"

jobs:
  test-and-render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install rendering tools
        run: |
          sudo apt-get update
          sudo apt-get install -y libreoffice-impress poppler-utils fonts-noto-cjk python3-pil
          python3 -m pip install --quiet python-pptx
      - name: Install native engine dependencies
        working-directory: pptx/native
        run: npm install --no-audit --no-fund
      - name: Check legacy batch converter syntax
        run: |
          node --check pptx/batch_html2pptx.js
          node --check pptx/slide_order.js
      - name: Run native engine tests
        working-directory: pptx/native
        run: npm test
      - name: Extract CSS design tokens and generate migration demo
        working-directory: pptx/native
        run: |
          python ../scripts/extract_html_design_tokens.py ../examples/design-reference.html native-theme-profile
          npm run demo:theme
          npm run demo:parity
      - name: Generate editable demo decks
        working-directory: pptx/native
        run: |
          npm run demo
          npm run demo:components
          npm run demo:layouts
          npm run demo:images
          npm run demo:stress
          npm run batch:example
      - name: Audit generated decks for editability
        working-directory: pptx/native
        run: |
          node scripts/audit_deck.js native-demo.pptx --min-text-shapes 1
          node scripts/audit_deck.js native-components-demo.pptx --min-text-shapes 1
          node scripts/audit_deck.js native-images-demo.pptx --min-text-shapes 1
          node scripts/audit_deck.js native-stress-deck.pptx --min-text-shapes 1 --fail-on-warning
      - name: Convert the HTML fixtures through the native pipeline
        working-directory: pptx/native
        run: |
          npm run pipeline:pptx
          npm run pipeline:parity
          npm run pipeline:chart
          npm run pipeline:decor
          npm run pipeline:grid
          npm run pipeline:structural
          npm run pipeline:indent
          npm run pipeline:wrap
          npm run pipeline:stress
          npm run audit:pipeline
          # The converted table must keep its declared column proportions.
          python scripts/verify_native_ooxml.py pipeline-converted/pipeline-converted.pptx --require-table --require-uneven-columns
          # Declared charts must be live chart parts, not pictures, and the
          # rotated watermark must carry a real xfrm rotation.
          python scripts/verify_native_ooxml.py pipeline-converted/pipeline-chart.pptx --require-chart --require-rotation
      - name: Verify editable OOXML visual effects
        working-directory: pptx/native
        run: |
          python scripts/verify_native_ooxml.py native-design-migration-demo.pptx --require-gradient --require-shadow --require-alpha
      - name: Verify editable picture crops, outlines, and shadows
        working-directory: pptx/native
        run: |
          python scripts/verify_native_ooxml.py native-images-demo.pptx --require-image-crop --require-picture-effects
          python scripts/verify_native_ooxml.py native-stress-deck.pptx --require-image-crop --require-table --require-gradient --require-shadow
      - name: Extract design profile from generated deck
        working-directory: pptx/native
        run: python ../scripts/extract_native_design.py native-components-demo.pptx design-profile
      - name: Compile and test design extraction scripts
        working-directory: pptx/native
        run: |
          node --check pipeline/cli.js
          node --check pipeline/analyzer.js
          node --check pipeline/deck_builder.js
          node --check scripts/audit_deck.js
          python -m py_compile ../scripts/extract_native_design.py ../scripts/extract_html_design_tokens.py scripts/render_check.py scripts/render_with_libreoffice.py scripts/promote_goldens.py scripts/visual_regression.py scripts/verify_native_ooxml.py scripts/preview_deck.py
          python ../scripts/extract_html_design_tokens.py --self-test
          python scripts/visual_regression.py --self-test
      - name: Render and verify demo decks
        working-directory: pptx/native
        run: |
          npm run render:demo
          npm run render:components
          npm run render:layouts
          npm run render:images
          npm run render:stress
          npm run render:pipeline
          npm run render:chart
          npm run render:decor
          npm run render:grid
          npm run render:structural
          npm run render:indent
          npm run render:wrap
          npm run render:pipeline-stress
          npm run render:batch
          npm run render:theme
          npm run render:parity
      - name: Render offline layout previews
        working-directory: pptx/native
        run: |
          python scripts/preview_deck.py native-stress-deck.pptx --output-dir preview/stress --sheet preview/stress-sheet.png
          python scripts/preview_deck.py native-images-demo.pptx --output-dir preview/images --sheet preview/images-sheet.png
          python scripts/preview_deck.py pipeline-converted/pipeline-converted.pptx --output-dir preview/pipeline --sheet preview/pipeline-sheet.png
          python scripts/preview_deck.py pipeline-converted/pipeline-chart.pptx --output-dir preview/chart --sheet preview/chart-sheet.png
          python scripts/preview_deck.py pipeline-converted/pipeline-decorations.pptx --output-dir preview/decor --sheet preview/decor-sheet.png
          python scripts/preview_deck.py pipeline-converted/pipeline-grid.pptx --output-dir preview/grid --sheet preview/grid-sheet.png
          python scripts/preview_deck.py pipeline-converted/pipeline-structural.pptx --output-dir preview/structural --sheet preview/structural-sheet.png
          python scripts/preview_deck.py pipeline-converted/pipeline-indent.pptx --output-dir preview/indent --sheet preview/indent-sheet.png
          python scripts/preview_deck.py pipeline-converted/pipeline-wrap.pptx --output-dir preview/wrap --sheet preview/wrap-sheet.png
          python scripts/preview_deck.py pipeline-converted/pipeline-stress.pptx --output-dir preview/pipeline-stress --sheet preview/pipeline-stress-sheet.png
      - name: Compare against reviewed golden slide images
        working-directory: pptx/native
        run: |
          set -e
          for deck in native-demo native-components-demo native-design-migration-demo \
                      native-design-parity-demo native-layouts-demo native-images-demo \
                      native-stress-deck pipeline-converted pipeline-chart pipeline-decorations pipeline-grid pipeline-structural pipeline-indent pipeline-wrap pipeline-stress; do
            golden="golden/$deck"
            if [ -d "$golden" ] && find "$golden" -maxdepth 1 -name '*.png' -print -quit | grep -q .; then
              python scripts/visual_regression.py \
                --baseline-dir "$golden" \
                --current-dir "render-check/$deck" \
                --output-dir "visual-regression/$deck" \
                --max-mae 0.015 --min-ssim 0.97
            else
              echo "No reviewed golden images for $deck; comparator self-test remains enabled."
            fi
          done
      - name: Upload PPTX and rendered previews
        uses: actions/upload-artifact@v4
        with:
          name: native-ppt-rendered-demos
          path: |
            pptx/native/native-demo.pptx
            pptx/native/native-components-demo.pptx
            pptx/native/native-layouts-demo.pptx
            pptx/native/native-images-demo.pptx
            pptx/native/native-stress-deck.pptx
            pptx/native/native-design-migration-demo.pptx
            pptx/native/native-design-parity-demo.pptx
            pptx/native/native-image-assets/
            pptx/native/native-stress-assets/
            pptx/native/native-theme-profile/
            pptx/native/parity/
            pptx/native/batch-dist/
            pptx/native/render-check/
            pptx/native/preview/
            pptx/native/visual-regression/
            pptx/native/design-profile/
            pptx/native/pipeline-converted/
            pptx/native/themes/
            pptx/scripts/extract_html_design_tokens.py
            pptx/native/scripts/visual_regression.py
