name: Native PPT engine tests

on:
  push:
    branches: [main, native-ppt-engine]
    paths:
      - "pptx/native/**"
      - "pptx/tests/**"
      - "pptx/examples/**"
      - "pptx/SKILL.md"
      - ".github/workflows/native-ppt.yml"
  pull_request:
    paths:
      - "pptx/native/**"
      - "pptx/tests/**"
      - "pptx/examples/**"
      - "pptx/SKILL.md"
      - ".github/workflows/native-ppt.yml"

jobs:
  test-and-render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install rendering tools
        run: |
          sudo apt-get update
          sudo apt-get install -y libreoffice-impress poppler-utils fonts-noto-cjk
      - name: Install native engine dependencies
        working-directory: pptx/native
        run: npm install --no-audit --no-fund
      - name: Run native engine tests
        working-directory: pptx/native
        run: npm test
      - name: Generate editable demo decks
        working-directory: pptx/native
        run: |
          npm run demo
          npm run demo:components
          npm run batch:example
      - name: Render and verify demo decks
        working-directory: pptx/native
        run: |
          npm run render:demo
          npm run render:components
          npm run render:batch
      - name: Upload PPTX and rendered previews
        uses: actions/upload-artifact@v4
        with:
          name: native-ppt-rendered-demos
          path: |
            pptx/native/native-demo.pptx
            pptx/native/native-components-demo.pptx
            pptx/native/batch-dist/
            pptx/native/render-check/
