<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>relative · aspect-ratio</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: "PingFang SC", "Noto Sans SC", sans-serif; }
  .slide { width: 1280px; height: 720px; padding: 52px 64px; background: #FAF8F4; color: #22302E; }

  .kicker { font-size: 12px; letter-spacing: 3px; text-transform: uppercase; color: #B4633A; }
  h1 { margin: 12px 0 8px; font-size: 30px; line-height: 1.3; font-weight: 600; }
  .lede { margin: 0 0 24px; font-size: 13px; line-height: 1.9; color: #6E7A76; width: 880px; }

  .row { display: flex; flex-direction: row; gap: 16px; width: 1152px; }
  .card {
    flex: 1; position: relative;
    padding: 20px 20px 22px;
    background: #FFFFFF; border-radius: 12px;
    border-top: 3px solid #D8CFC0;
  }
  .card.featured { border-top-color: #17332F; }
  .card h2 { margin: 0 0 8px; font-size: 16px; }
  .card p { margin: 0; font-size: 12px; line-height: 1.85; color: #566; }

  /* 相对定位：只移动徽标本身，不回推兄弟元素，也不改变卡片尺寸 */
  .badge {
    position: relative; top: -15px; left: 226px;
    width: 108px; height: 30px;
    padding: 5px 12px;
    background: #B4633A; border-radius: 15px;
    color: #FFFFFF; font-size: 11px; letter-spacing: 1px;
  }

  .media { display: flex; flex-direction: row; gap: 16px; width: 1152px; margin-top: 26px; }
  /* 宽高比：宽度决定高度，16/9 的媒体区在 520px 宽下是 292.5px 高 */
  .stage { width: 520px; aspect-ratio: 16 / 9; background: #17332F; border-radius: 14px; }
  .thumb { width: 240px; aspect-ratio: 1; background: #E7EFEC; border-radius: 14px; }
  .thumb.alt { background: #EFE7DC; }

  .foot { position: absolute; left: 64px; bottom: 40px; font-size: 11px; color: #9AA5A1; }
</style>
</head>
<body>
<main class="slide">
  <div class="kicker">relative · aspect-ratio</div>
  <h1>相对偏移只挪自己，宽高比由宽度定高</h1>
  <p class="lede">中间卡片的右上角压着一枚徽标，它用 <code>position: relative</code> 向上向右移动，兄弟卡片纹丝不动；下方的媒体区用 <code>aspect-ratio: 16 / 9</code> 声明宽度、由宽度算出高度。</p>

  <div class="row">
    <div class="card">
      <h2>普通卡片</h2>
      <p>相对定位元素仍然占据它原来的位置，只是画在别处。</p>
    </div>
    <div class="card featured">
      <div class="badge">NEW</div>
      <h2>强调卡片</h2>
      <p>徽标向右 226px、向上 15px，正好压住卡片的上边框，兄弟卡片的高度一点没变。</p>
    </div>
    <div class="card">
      <h2>普通卡片</h2>
      <p>父元素的尺寸按正常流计算，不包含那枚被移动的徽标。</p>
    </div>
  </div>

  <div class="media">
    <div class="stage"></div>
    <div class="thumb"></div>
    <div class="thumb alt"></div>
  </div>

  <div class="foot">相对偏移 · 宽高比 · 全部可编辑：文本框、圆角矩形、徽标</div>
</main>
</body>
</html>
