<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1280, initial-scale=1">
<title>HTML ↔ Native visual parity reference</title>
<style>
@page { size: 1280px 720px; margin: 0; }
:root {
  --color-background: #101820;
  --color-foreground: #F5F7F8;
  --color-primary: #F2AA4C;
  --color-accent: #00A6A6;
  --color-muted: #AAB7C4;
  --color-surface: #1B2836;
  --color-border: #344657;
  --font-heading: "Aptos Display", sans-serif;
  --font-body: "Aptos", sans-serif;
  --font-cjk: "Microsoft YaHei", sans-serif;
  --font-size-title: 38px;
  --font-size-heading: 26px;
  --font-size-body: 18px;
  --font-size-caption: 12px;
  --space-xs: 8px;
  --space-sm: 12px;
  --space-md: 20px;
  --space-lg: 32px;
  --space-xl: 48px;
  --radius-card: 14px;
  --hero-gradient: linear-gradient(135deg, #142536 0%, #234B61 58%, #E56A42 100%);
  --card-shadow: 0 8px 24px rgba(0, 0, 0, 0.20);
  --surface-opacity: 0.92;
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  color: var(--color-foreground);
  background: var(--color-background);
  font-family: var(--font-body);
  font-size: var(--font-size-body);
}
.slide {
  position: relative;
  width: 1280px;
  height: 720px;
  overflow: hidden;
  background: var(--color-background);
}
.right-panel {
  position: absolute;
  top: 0;
  right: 0;
  width: 35.1%;
  height: 100%;
  background: var(--color-surface);
}
.accent-bar {
  position: absolute;
  left: 75px;
  top: 79px;
  width: 12px;
  height: 69px;
  background: var(--color-accent);
}
h1 {
  display: flex;
  align-items: center;
  position: absolute;
  left: 104px;
  top: 75px;
  width: 691px;
  height: 96px;
  margin: 0;
  color: var(--color-primary);
  font-family: var(--font-heading);
  font-size: var(--font-size-title);
  font-weight: 700;
  line-height: 1.1;
}
.subtitle {
  position: absolute;
  left: 106px;
  top: 197px;
  width: 653px;
  height: 96px;
  margin: 0;
  color: var(--color-foreground);
  font-family: var(--font-body);
  font-size: var(--font-size-body);
  line-height: 1.22;
}
.card {
  position: absolute;
  left: 104px;
  top: 341px;
  width: 643px;
  height: 197px;
  padding: 0;
  background: var(--color-surface);
  border: 1px solid var(--color-border);
  border-radius: var(--radius-card);
}
.card h2 {
  display: flex;
  align-items: center;
  position: absolute;
  left: 32px;
  top: 31px;
  width: 566px;
  height: 46px;
  margin: 0;
  color: var(--color-primary);
  font-family: var(--font-heading);
  font-size: var(--font-size-heading);
  font-weight: 700;
  line-height: 1.1;
}
.card p {
  position: absolute;
  left: 32px;
  top: 96px;
  width: 562px;
  height: 69px;
  margin: 0;
  color: var(--color-foreground);
  font-family: var(--font-body);
  font-size: var(--font-size-body);
  line-height: 1.22;
}
.micro-label {
  display: flex;
  align-items: center;
  position: absolute;
  left: 869px;
  top: 571px;
  width: 346px;
  height: 29px;
  color: var(--color-muted);
  font-family: var(--font-body);
  font-size: var(--font-size-caption);
  font-weight: 700;
}
.accent-rule {
  position: absolute;
  left: 869px;
  top: 616px;
  width: 216px;
  height: 8px;
  background: var(--color-accent);
}

</style>
</head>
<body>
<main class="slide">
  <aside class="right-panel" aria-hidden="true"></aside>
  <div class="accent-bar" aria-hidden="true"></div>
  <h1>从 HTML 到原生 PowerPoint</h1>
  <p class="subtitle">保留设计语言、信息层级与视觉节奏，让内容对象保持可编辑。</p>
  <section class="card">
    <h2>设计迁移原则</h2>
    <p>颜色、字体、卡片和留白应由同一套设计 Tokens 驱动。</p>
  </section>
  <div class="micro-label">VISUAL SYSTEM / 01</div>
  <div class="accent-rule" aria-hidden="true"></div>
</main>
</body>
</html>
