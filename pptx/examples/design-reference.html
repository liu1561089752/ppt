<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<style>
:root {
  --color-background: #101820; --color-foreground: #F5F7F8;
  --color-primary: #F2AA4C; --color-accent: #00A6A6;
  --color-muted: #AAB7C4; --color-surface: #1B2836; --color-border: #344657;
  --font-heading: "Aptos Display", sans-serif; --font-body: "Aptos", sans-serif;
  --font-cjk: "Microsoft YaHei", sans-serif;
  --font-size-title: 38px; --font-size-heading: 26px; --font-size-body: 18px; --font-size-caption: 12px;
  --space-xs: 8px; --space-sm: 12px; --space-md: 20px; --space-lg: 32px; --space-xl: 48px;
  --radius-card: 14px;
  --hero-gradient: linear-gradient(135deg, #142536 0%, #234B61 58%, #E56A42 100%);
  --card-shadow: 0 8px 24px rgba(0, 0, 0, 0.20);
  --surface-opacity: 0.92;
}
body { color:var(--color-foreground); background:var(--color-background); font-family:var(--font-body); font-size:var(--font-size-body); }
h1 { color:var(--color-primary); font-family:var(--font-heading); font-size:var(--font-size-title); }
h2 { color:var(--color-primary); font-family:var(--font-heading); font-size:var(--font-size-heading); }
p { color:var(--color-foreground); font-family:var(--font-body); font-size:var(--font-size-body); }
.card { background:var(--color-surface); border:1px solid var(--color-border); border-radius:var(--radius-card); padding:var(--space-lg); }
</style>
</head>
<body>
<main class="slide">
  <h1>从 HTML 到原生 PowerPoint</h1>
  <p>保留设计语言、信息层级与视觉节奏，让内容对象保持可编辑。</p>
  <section class="card"><h2>设计迁移原则</h2><p>颜色、字体、卡片和留白应由同一套设计 Tokens 驱动。</p></section>
</main>
</body>
</html>
