<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>clip-path · 斜切色块</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: "PingFang SC", "Noto Sans SC", sans-serif; }
  .slide { width: 1280px; height: 720px; background: #FCFBF8; color: #1D2A28; position: relative; overflow: hidden; }

  .band {
    position: absolute;
    left: 0;
    top: 0;
    width: 1280px;
    height: 300px;
    background: #17332F;
    clip-path: polygon(0 0, 100% 0, 100% 58%, 0 100%);
  }
  .kicker { position: absolute; left: 72px; top: 64px; font-size: 12px; letter-spacing: 3px; color: #9BB3AC; }
  .title { position: absolute; left: 72px; top: 96px; width: 760px; font-size: 40px; line-height: 1.25; font-weight: 600; color: #F6F3EA; }
  .sub { position: absolute; left: 72px; top: 210px; width: 620px; font-size: 14px; line-height: 1.9; color: #C9D6D1; }

  .panel {
    position: absolute;
    top: 372px;
    width: 340px;
    height: 236px;
    background: #E9E2D2;
    clip-path: polygon(0 0, 100% 0, 100% 100%, 0 82%);
  }
  .panel.b { left: 472px; background: #DDE7E2; clip-path: polygon(0 0, 100% 0, 100% 82%, 0 100%); }
  .panel.c { left: 864px; background: #1D2A28; clip-path: polygon(0 0, 100% 14%, 100% 100%, 0 100%); }

  .panel-title { position: absolute; top: 404px; width: 288px; font-size: 17px; font-weight: 600; }
  .panel-body { position: absolute; top: 436px; width: 288px; font-size: 12px; line-height: 1.8; color: #55605C; }
  .panel-title.a, .panel-body.a { left: 24px; }
  .panel-title.b, .panel-body.b { left: 496px; }
  .panel-title.c, .panel-body.c { left: 888px; }
  .panel-title.c { color: #F6F3EA; }
  .panel-body.c { color: #B7C6C1; }

  .foot { position: absolute; left: 72px; bottom: 36px; width: 900px; font-size: 11px; color: #9AA5A1; }
</style>
</head>
<body>
<main class="slide">
  <div class="band"></div>
  <div class="kicker">CLIP-PATH</div>
  <div class="title">斜切色块是草图里的形状，不是贴图</div>
  <div class="sub">CSS 的 <b>polygon()</b> 在 PowerPoint 里有对应物：自定义几何。裁剪后的色块仍然是一个可以拖动、可以改色的形状，而不是一张被切过的图片。</div>

  <div class="panel a"></div>
  <div class="panel b"></div>
  <div class="panel c"></div>

  <div class="panel-title a">几何是形状的</div>
  <div class="panel-body a">多边形的每一顶点都是形状路径上的一段，编辑顶点就能改角度，不需要回到源文件。</div>

  <div class="panel-title b">边框跟着走</div>
  <div class="panel-body b">描边沿自定义路径绘制，所以斜边的边框不会缺一段，也不需要另画一条线来补。</div>

  <div class="panel-title c">填充同样是</div>
  <div class="panel-body c">渐变填充在自定义几何里照常生效，深浅随形状边缘裁剪，而不是按矩形铺满。</div>

  <div class="foot">clip-path: polygon() · 自定义几何 · 顶点可编辑，不是图片</div>
</main>

</body>
</html>
